site_name: SampleDisco
site_description: A config-driven pipeline for sample-level representation learning from single-cell RNA, ATAC, and unpaired multi-omics data.
site_url: https://j041120h.github.io/SampleDisco_tutorial/
repo_url: https://github.com/J041120h/SampleDisco
repo_name: J041120h/SampleDisco
use_directory_urls: true
strict: true

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    logo: material/dna
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home: index.md
  - Installation: installation.md
  - Tutorials:
      - "1. Download the demo data": tutorials/demo_data.md
      - "2. Quick start": tutorials/quickstart.md
      - "3. RNA": tutorials/rna.md
      - "4. ATAC": tutorials/atac.md
      - "5. RNA + ATAC (scGLUE)": tutorials/multiomics.md
      - "6. RNA + flow cytometry (MaxFuse)": tutorials/multiomics_maxfuse.md
      - "7. Downstream analysis": tutorials/downstream/index.md
  - Advanced:
      - Configuration guide: tutorials/configuration.md
      - Config key reference: tutorials/config_reference.md
      - Outputs and resuming runs: tutorials/outputs.md
      - Sample embedding in depth: tutorials/sample_embedding.md
      - Downstream options and caveats: tutorials/downstream_details.md
      - Using your own data: tutorials/own_data.md
      - GPU acceleration: tutorials/gpu.md
      - Legacy embedding key names: legacy_keys.md
      - Changelog: changelog.md
  - API reference:
      - Overview: api/index.md
      - Pipeline:
          - wrapper: api/pipeline/wrapper.md
          - downstream_analysis: api/pipeline/downstream_analysis.md
      - RNA:
          - Overview: api/rna.md
          - preprocess: api/rna/preprocess_linux.md
          - "cell_types (RNA and ATAC)": api/rna/cell_types_linux.md
      - ATAC:
          - Overview: api/atac.md
          - preprocess: api/atac/preprocess_linux.md
      - Multi-omics:
          - Overview: api/multiomics.md
          - multiomics_preparation: api/multiomics/multiomics_preparation.md
          - harmonize_xglue: api/multiomics/harmonize_xglue.md
          - cell_types_multiomics: api/multiomics/cell_types_multiomics_linux.md
          - "compute_sample_embedding (multi-omics)": api/multiomics/calculate_multiomics_sample_embedding.md
          - "replace_optimal_dimension_reduction (legacy)": api/multiomics/replace_optimal_dimension_reduction.md
      - Shared:
          - compute_sample_embedding: api/shared/calculate_sample_embedding.md
          - run_autotune: api/shared/run_autotune.md
          - build_sample_adata: api/shared/build_sample_adata.md
          - save_embedding_to_h5ad: api/shared/save_embedding_to_h5ad.md
      - Downstream:
          - Overview: api/downstream.md
          - sample_distance: api/downstream/sample_distance.md
          - run_dimension_association_analysis: api/downstream/sample_association.md
          - CCA_Call: api/downstream/trajectory_cca_call.md
          - cca_pvalue_test: api/downstream/trajectory_cca_pvalue_test.md
          - TSCAN: api/downstream/trajectory_tscan.md
          - run_trajectory_gam_differential_gene_analysis: api/downstream/trajectory_gam_dge.md
          - cluster: api/downstream/cluster.md
          - proportion_test: api/downstream/proportion_test.md
          - raisinfit: api/downstream/raisinfit.md
          - run_pairwise_tests: api/downstream/run_pairwise_tests.md
          - predict_phenotype: api/downstream/predict_phenotype.md
          - transfer_labels: api/downstream/transfer_labels.md
          - visualization: api/downstream/visualization.md
          - visualize_multimodal_embedding: api/downstream/visualize_multimodal_embedding.md
      - Utilities:
          - harmonize_embedding: api/utils/harmonize_embedding.md
          - "migrate_obsm_keys and key resolvers": api/utils/embedding_keys.md
          - summarize_h5ad: api/utils/summarize_h5ad.md
